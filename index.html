<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make10-Express Premium</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        h1 {
            color: #333;
            font-size: clamp(20px, 6vw, 28px); 
            text-align: center;
            line-height: 1.4;
            min-height: 60px; 
            margin-bottom: 10px;
        }

        #statusArea {
            display: flex;
            flex-wrap: wrap; 
            justify-content: center;
            gap: 10px 20px; 
            margin-bottom: 15px;
            font-size: clamp(16px, 5vw, 20px);
            font-weight: bold;
            min-height: 30px;
            align-items: center;
        }

        #comboDisplay {
            color: #ff9900;
            background-color: #fff3cd;
            padding: 2px 10px;
            border-radius: 20px;
            display: none;
        }

        #chanceDisplay {
            color: #dc3545;
            animation: blink 0.8s infinite alternate;
            display: none;
        }

        @keyframes blink {
            0% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        /* ★追加：ハッピーイエロートレイン時のバナー */
        #happyBanner {
            display: none;
            color: #d48806;
            font-size: clamp(16px, 4vw, 20px);
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
            background-color: #fff3cd;
            padding: 5px 15px;
            border-radius: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            animation: float 2s infinite ease-in-out;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }

        /* 5両×2段の車庫（基本設定） */
        #trainContainer {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            background-color: #e0e0e0;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            transition: transform 2s ease-in, background-color 0.5s, box-shadow 0.5s;
        }

		/* ★修正：ハッピーモード（青空エクスプレス）の特別演出 */
        #trainContainer.happy-mode {
            /* 線路がくっきり見え、黄色も鮮やかに映える「明るい青空」のグラデーション */
            background: linear-gradient(135deg, #e1f5fe, #81d4fa);
            /* 特別感のあるゴールドの光と枠線はキープ */
            box-shadow: 0 0 20px rgba(255, 193, 7, 0.6);
            border: 3px solid #ffc107;
        }

        .car-slot {
            width: 80px;
            height: 80px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        #numberPad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
            visibility: hidden;
        }

        .num-btn {
            width: 80px;
            height: 80px;
            font-size: 36px;
            font-weight: bold;
            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }

        .num-btn:active {
            transform: scale(0.95);
        }

        .control-area {
            display: flex;
            gap: 20px;
        }

        .ctrl-btn {
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        #startBtn { background-color: #28a745; }
        #endBtn { background-color: #dc3545; display: none; }

        @keyframes mildShake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }
        .shake {
            animation: mildShake 0.4s ease-in-out;
            background-color: #6c757d !important;
        }

        .run-away {
            transform: translateX(150vw);
        }
    </style>
</head>
<body>

    <h1 id="questionText">ボタンをおしてね！</h1>

    <div id="statusArea">
        <div id="comboDisplay">0 コンボ</div>
        <div id="chanceDisplay">つぎのレア確率: 10%</div>
    </div>

    <div id="happyBanner">✨ ハッピーイエロートレイン 運行中！ (ボーナスタイム) ✨</div>

    <div id="trainContainer"></div>

    <div id="numberPad"></div>

    <div class="control-area">
        <button id="startBtn" class="ctrl-btn">はじめる</button>
        <button id="endBtn" class="ctrl-btn">おわる</button>
    </div>

    <audio id="sndVoice" src="voice.mp3"></audio>
    <audio id="sndDoremi" src="doremi.mp3"></audio>

    <script>
        const questionText = document.getElementById('questionText');
        const trainContainer = document.getElementById('trainContainer');
        const numberPad = document.getElementById('numberPad');
        const startBtn = document.getElementById('startBtn');
        const endBtn = document.getElementById('endBtn');
        const sndVoice = document.getElementById('sndVoice');
        const sndDoremi = document.getElementById('sndDoremi');
        const comboDisplay = document.getElementById('comboDisplay');
        const chanceDisplay = document.getElementById('chanceDisplay');
        const happyBanner = document.getElementById('happyBanner'); // ★追加

        let isPlaying = false;
        let currentTarget = 10;
        let currentMissing = 0;
        let questionStartTime = 0;

        let comboCount = 0;          
        let nextYellowChance = 0.1;  
        let currentIsYellow = false; 

        function init() {
            renderTrains(0, false);
            for (let i = 1; i <= 9; i++) {
                const btn = document.createElement('button');
                btn.className = 'num-btn';
                btn.textContent = i;
                btn.onclick = () => checkAnswer(i, btn);
                numberPad.appendChild(btn);
            }
        }

        function renderTrains(presentCount, isYellow) {
            trainContainer.innerHTML = '';
            const trainImg = isYellow ? 'yellow.png' : 'train.png';
            
            for (let i = 0; i < 10; i++) {
                const slot = document.createElement('div');
                slot.className = 'car-slot';
                if (i < presentCount) {
                    slot.style.backgroundImage = `url('${trainImg}')`;
                } else {
                    slot.style.backgroundImage = "url('empty.png')";
                }
                trainContainer.appendChild(slot);
            }
        }

        function speakQuestion() {
            const utterance = new SpeechSynthesisUtterance('10両編成にするには、あと何両？');
            utterance.lang = 'ja-JP';
            utterance.rate = 0.9;
            speechSynthesis.speak(utterance);
        }

        function nextQuestion() {
            if (!isPlaying) return;
            
            trainContainer.classList.remove('run-away'); 
            currentIsYellow = Math.random() < nextYellowChance;

            // ★追加：イエローの時は背景演出とバナーをオン、通常の時はオフ
            if (currentIsYellow) {
                trainContainer.classList.add('happy-mode');
                happyBanner.style.display = 'block';
            } else {
                trainContainer.classList.remove('happy-mode');
                happyBanner.style.display = 'none';
            }

            const presentCars = Math.floor(Math.random() * 9) + 1;
            currentMissing = 10 - presentCars; 

            renderTrains(presentCars, currentIsYellow);
            questionText.innerHTML = '10両編成にするには<br>あと何両？';
            
            questionStartTime = Date.now();
            setTimeout(speakQuestion, 500);
        }

        function updateStatusUI() {
            if (comboCount > 0) {
                comboDisplay.textContent = `${comboCount} コンボ！`;
                comboDisplay.style.display = 'block';
            } else {
                comboDisplay.style.display = 'none';
            }

            if (nextYellowChance > 0.1) {
                chanceDisplay.textContent = `つぎのレア確率: ${Math.round(nextYellowChance * 100)}% 🔥`;
                chanceDisplay.style.display = 'block';
            } else {
                chanceDisplay.style.display = 'none';
            }
        }

        function checkAnswer(selectedNumber, btnElement) {
            if (!isPlaying) return;

            if (selectedNumber === currentMissing) {
                const answerTime = Date.now();
                const responseTime = (answerTime - questionStartTime) / 1000; 
                
                let rankHtml = '';
                let trainSpeed = '';

                // ★追加：ボーナスタイムの閾値（しきいち）設定
                // イエローなら制限時間を延長。通常は2.5秒と5.0秒
                const kaitokuLimit = currentIsYellow ? 4.0 : 2.5;
                const tokkyuLimit = currentIsYellow ? 6.5 : 5.0;

                if (responseTime <= kaitokuLimit) {
                    rankHtml = '<span style="background-color: #009944; color: #ffffff; padding: 4px 12px; border-radius: 4px; font-weight: bold;">快特 (かいとく)</span>';
                    trainSpeed = '0.8s'; 
                    comboCount++;
                    nextYellowChance = 0.7; 
                } else if (responseTime <= tokkyuLimit) {
                    rankHtml = '<span style="background-color: #e60012; color: #ffffff; padding: 4px 12px; border-radius: 4px; font-weight: bold;">特急 (とっきゅう)</span>';
                    trainSpeed = '1.5s'; 
                    nextYellowChance = 0.3;
                } else {
                    rankHtml = '<span style="color: #333333; font-weight: bold;">普通 (ふつう)</span>';
                    trainSpeed = '3.0s'; 
                    comboCount = 0;
                    nextYellowChance = 0.1;
                }

                updateStatusUI();

                const currentPitch = Math.min(1.0 + (comboCount * 0.05), 1.25);
                sndDoremi.playbackRate = currentPitch;

                questionText.innerHTML = `${rankHtml} <span style="white-space: nowrap;">出発進行！ <span style="font-size:16px;">(タイム: ${responseTime.toFixed(1)}秒)</span></span>`;
                
                sndVoice.play();
                setTimeout(() => sndDoremi.play(), 1000); 

                renderTrains(10, currentIsYellow);
                trainContainer.style.transitionDuration = trainSpeed;

                setTimeout(() => {
                    trainContainer.classList.add('run-away');
                }, 1000);

                setTimeout(() => {
                    nextQuestion();
                }, 3500);

            } else {
                comboCount = 0;
                nextYellowChance = 0.1;
                updateStatusUI();

                btnElement.classList.add('shake');
                setTimeout(() => {
                    btnElement.classList.remove('shake');
                }, 400);
            }
        }

        startBtn.onclick = () => {
            isPlaying = true;
            startBtn.style.display = 'none';
            endBtn.style.display = 'inline-block';
            numberPad.style.visibility = 'visible';
            
            comboCount = 0;
            nextYellowChance = 0.1;
            updateStatusUI();
            sndDoremi.playbackRate = 1.0;

            sndVoice.volume = 0; sndVoice.play(); sndVoice.pause(); sndVoice.volume = 1;
            sndDoremi.volume = 0; sndDoremi.play(); sndDoremi.pause(); sndDoremi.volume = 1;

            nextQuestion();
        };

        endBtn.onclick = () => {
            isPlaying = false;
            startBtn.style.display = 'inline-block';
            endBtn.style.display = 'none';
            numberPad.style.visibility = 'hidden';
            comboDisplay.style.display = 'none';
            chanceDisplay.style.display = 'none';
            happyBanner.style.display = 'none'; // ★追加
            trainContainer.classList.remove('happy-mode'); // ★追加
            questionText.textContent = 'ボタンをおしてね！';
            trainContainer.classList.remove('run-away');
            renderTrains(0, false);
            speechSynthesis.cancel(); 
        };

        window.onload = init;
    </script>
</body>
</html>
